title = "Gitleaks Configuration"

[extend]
useDefault = true

[allowlist]
description = "Global allowlist - SECURITY: Keep exclusions minimal and audit regularly"
paths = [
  # Build artifacts (safe to exclude)
  '''\.zig-cache''',
  '''zig-out''',
  '''vendor''',
  '''.*\.log$''',

  # Test certificates and keys - intentionally committed for testing
  # WARNING: These are TEST KEYS ONLY - never use in production!
  # Files in these paths are self-signed test certificates, not real secrets.
  '''testdata/.*\.pem$''',

  # Test vector files containing expected cryptographic outputs
  # These are published test vectors from RFCs, not secrets
  '''.*_vectors\.zig$''',

  # Test files and directories containing RFC test vectors and conformance data
  # These contain TLS key derivation test data from RFCs (8446, 9001, etc.)
  '''tests/.*\.zig$''',
  '''tests/.*\.pem$''',
  '''tests/.*\.key$''',
  '''tests/.*\.crt$''',

  # Specification documents (may contain example keys from RFCs)
  # AUDIT: Periodically review specs/ for accidentally committed secrets
  # Files are .txt format (RFC specifications downloaded from IETF)
  '''specs/.*\.txt$''',
]
stopwords = [
  # TLS 1.3 key derivation variable names (not actual secrets)
  "initial_secret",
  "client_secret",
  "client_initial_secret",
  "ecdhe_secret",
  "expected_initial_secret_hex",
  "expected_client_secret_hex",
  # X.509 extension name
  "keyCertSign",
]
