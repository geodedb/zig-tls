---
# GitLab CI/CD Pipeline for tls
# SPDX-License-Identifier: Apache-2.0

default:
  tags:
    - company

include:
  # SEC-061: Components pinned to commit SHAs (not tags) so an upstream
  # re-tag cannot silently change our pipeline. Comments note the tag
  # that was resolved and the date of resolution. Bump via a deliberate
  # commit that updates SHA + comment together.
  #
  # Security scanning
  - component: gitlab.com/devnw/ci-catalog/security-sast@41983cfbddfe06a5e6e3c126a7f16404d36c7ef9  # was v1.7.1 (2026-04-19)
  - component: gitlab.com/devnw/ci-catalog/security-dependency-scanning@41983cfbddfe06a5e6e3c126a7f16404d36c7ef9  # was v1.7.1 (2026-04-19)
  - component: gitlab.com/devnw/ci-catalog/security-secrets@41983cfbddfe06a5e6e3c126a7f16404d36c7ef9  # was v1.7.1 (2026-04-19)
  - component: gitlab.com/devnw/ci-catalog/security-gitleaks@41983cfbddfe06a5e6e3c126a7f16404d36c7ef9  # was v1.7.1 (2026-04-19)

  # Code quality
  - component: gitlab.com/devnw/ci-catalog/zig-format@d421e26e2e02e8449b295e1f2f047ec58128f1a5  # was v1.2.1 (2026-04-19)

  # SBOM
  - component: gitlab.com/devnw/ci-catalog/sbom-generate@41983cfbddfe06a5e6e3c126a7f16404d36c7ef9  # was v1.7.1 (2026-04-19)
  - component: gitlab.com/devnw/ci-catalog/sbom-scan@41983cfbddfe06a5e6e3c126a7f16404d36c7ef9  # was v1.7.1 (2026-04-19)

  # Release
  - component: gitlab.com/devnw/ci-catalog/release-semantic@41983cfbddfe06a5e6e3c126a7f16404d36c7ef9  # was v1.7.1 (2026-04-19)

variables:
  ZIG_VERSION: "0.16.0"

stages:
  - lint
  - build
  - test
  - fuzz
  - security
  - sbom
  - release

# Zig installation template (SEC-R6-02: SHA-256 verified via ziglang.org index)
.install-zig: &install-zig
  - apt-get update && apt-get install -y curl xz-utils python3
  - |
    if [ ! -f "zig-${ZIG_VERSION}/zig" ]; then
      ARCH=$(uname -m)
      case "$ARCH" in
        x86_64)  ZIG_ARCH="x86_64" ;;
        aarch64) ZIG_ARCH="aarch64" ;;
        arm64)   ZIG_ARCH="aarch64" ;;
        *)       echo "Unsupported architecture: $ARCH"; exit 1 ;;
      esac
      MAJOR=$(echo "$ZIG_VERSION" | cut -d. -f1)
      MINOR=$(echo "$ZIG_VERSION" | cut -d. -f2)
      if [ "$MAJOR" -eq 0 ] && [ "$MINOR" -lt 15 ]; then
        ARCHIVE_NAME="zig-linux-${ZIG_ARCH}-${ZIG_VERSION}"
      else
        ARCHIVE_NAME="zig-${ZIG_ARCH}-linux-${ZIG_VERSION}"
      fi
      TARBALL="${ARCHIVE_NAME}.tar.xz"
      INDEX_FILE=$(mktemp)
      curl -fsSL "https://ziglang.org/download/index.json" -o "${INDEX_FILE}"
      EXPECTED_HASH=$(ZIG_VER="${ZIG_VERSION}" ZIG_ARCH_KEY="${ZIG_ARCH}-linux" ZIG_IDX="${INDEX_FILE}" \
        python3 -c "
    import json, os, sys
    idx = json.load(open(os.environ['ZIG_IDX']))
    pkg = idx.get(os.environ['ZIG_VER'], {}).get(os.environ['ZIG_ARCH_KEY'], {})
    h = pkg.get('shasum', '')
    if not h: sys.exit('SHA-256 not found for ' + os.environ['ZIG_VER'] + '/' + os.environ['ZIG_ARCH_KEY'])
    print(h)
    ")
      rm -f "${INDEX_FILE}"
      curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/${TARBALL}" -o "${TARBALL}"
      echo "${EXPECTED_HASH}  ${TARBALL}" | sha256sum --check --strict
      tar -xJf "${TARBALL}"
      mv "${ARCHIVE_NAME}" "zig-${ZIG_VERSION}"
      rm -f "${TARBALL}"
    fi
  - export PATH="$PWD/zig-${ZIG_VERSION}:$PATH"
  - zig version

# Hidden template: cache the extracted Zig toolchain directory + the
# build's .zig-cache between jobs. Keyed on ZIG_VERSION so toolchain
# bumps invalidate cleanly; .zig-cache keyed on branch so unrelated
# branches do not poison each other.
.cache-zig: &cache-zig
  cache:
    - key: "zig-toolchain-${ZIG_VERSION}"
      paths:
        - "zig-${ZIG_VERSION}/"
      policy: pull-push
    - key: "zig-cache-${CI_COMMIT_REF_SLUG}"
      paths:
        - ".zig-cache/"
      policy: pull-push

# Override zig-format component to use the project's ZIG_VERSION.
# The v1.2.1 component defaults to 0.14.0 and does not accept a version input.
zig-format:
  <<: *cache-zig
  timeout: 15m
  before_script:
    - *install-zig

# Build job
build:
  stage: build
  image: debian:bookworm-slim
  timeout: 30m
  <<: *cache-zig
  before_script:
    - *install-zig
  script:
    - zig build

# Unit tests
test:
  stage: test
  image: debian:bookworm-slim
  timeout: 30m
  <<: *cache-zig
  before_script:
    - *install-zig
  script:
    - zig build test --summary all
  needs:
    - build

# Release optimization tests
test-release-safe:
  stage: test
  image: debian:bookworm-slim
  timeout: 45m
  <<: *cache-zig
  before_script:
    - *install-zig
  script:
    - zig build test -Doptimize=ReleaseSafe --summary all
  needs:
    - build

# ReleaseFast tests
test-release-fast:
  stage: test
  image: debian:bookworm-slim
  timeout: 45m
  <<: *cache-zig
  before_script:
    - *install-zig
  script:
    - zig build test -Doptimize=ReleaseFast --summary all
  needs:
    - build

# ReleaseSmall tests
test-release-small:
  stage: test
  image: debian:bookworm-slim
  timeout: 45m
  <<: *cache-zig
  before_script:
    - *install-zig
  script:
    - zig build test -Doptimize=ReleaseSmall --summary all
  needs:
    - build

# Coverage-guided fuzz testing.
# Runs with a 60-second timeout so the job always terminates.
#
# Exit-code semantics:
#   rc=0   : fuzzer stopped cleanly before timeout (no crash)
#   rc=124 : timeout reached (expected in CI) - pass
#   other  : fuzzer found a crash - FAIL THE JOB
#
# Seed corpus under tests/fuzz/corpus/ is copied into zig-out/fuzz/ before
# the run so prior-regression inputs are exercised first. The evolved
# corpus is persisted via GitLab cache so every run continues coverage
# from the previous one.
fuzz:
  stage: fuzz
  image: debian:bookworm-slim
  timeout: 20m
  before_script:
    - *install-zig
    - mkdir -p zig-out/fuzz
    - if [ -d tests/fuzz/corpus ]; then cp -R tests/fuzz/corpus/. zig-out/fuzz/; fi
  # GAP-0109: RSA-PSS differential regression gate runs the committed seed
  # corpus against both sig.rsa_pss_verify_sha256 and
  # parallel.verifyRsaPssWithHash, and fails the job if they diverge.
  # Coverage-guided mutation is deferred until Zig 0.16's std.testing.fuzz
  # stdlib compile error (writeStackTrace signature mismatch in
  # lib/compiler/test_runner.zig:566) is upstream-fixed.
  script:
    - timeout 60 zig build test --fuzz; rc=$?; if [ $rc -ne 0 ] && [ $rc -ne 124 ]; then exit $rc; fi
    - timeout 60 zig build fuzz-rsa-pss; rc=$?; if [ $rc -ne 0 ] && [ $rc -ne 124 ]; then exit $rc; fi
  artifacts:
    when: always
    paths:
      - zig-out/fuzz/
    expire_in: 30 days
  cache:
    - key: "fuzz-corpus-${CI_COMMIT_REF_SLUG}"
      paths:
        - zig-out/fuzz/
      policy: pull-push
    - key: "zig-toolchain-${ZIG_VERSION}"
      paths:
        - "zig-${ZIG_VERSION}/"
      policy: pull-push
    - key: "zig-cache-${CI_COMMIT_REF_SLUG}"
      paths:
        - ".zig-cache/"
      policy: pull-push
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
  needs:
    - build

# QUAL-339: ClientHello error-trace oracle regression gate.
# Re-runs the capture harness against HEAD and fails if the regenerated
# golden file diverges from the committed one. Byte-identical output is
# the empirical proof that SEC-054 errdefer, SEC-057 enum guard, and
# CWE-345 psk_seen ordering invariants all still hold after any future
# ClientHello parser/builder change.
client_hello_oracle:
  stage: test
  image: debian:bookworm-slim
  timeout: 5m
  <<: *cache-zig
  before_script:
    - *install-zig
  script:
    - zig build capture-client-hello-oracle
    - |
      if ! cmp tests/fuzz/corpus/client_hello_golden.bin <(git show HEAD:tests/fuzz/corpus/client_hello_golden.bin); then
        echo "ERROR: ClientHello error-trace oracle has diverged from the committed golden file"
        echo "This means a recent commit changed ClientHello parser behavior"
        echo "Either: (a) the change is intentional — regenerate the golden with 'zig build capture-client-hello-oracle'"
        echo "Or:     (b) the change is a security regression — revert and investigate"
        exit 1
      fi
  needs:
    - build

# QUAL-317: context.zig decomposition error-trace oracle regression gate.
# Mirrors the QUAL-339 client_hello_oracle job. Re-runs the capture harness
# against HEAD and fails if the regenerated golden diverges from the
# committed one. Byte-identical output is the empirical proof that the
# 8-module decomposition of Context has preserved every observable TLS 1.3
# handshake behavior (RFC 8446 §4/§7.2, SEC-054 errdefer, CWE-226 KU
# secret zeroization, PSK binder timing_safe, HRR transcript hash).
context_decomp_oracle:
  stage: test
  image: debian:bookworm-slim
  timeout: 5m
  <<: *cache-zig
  before_script:
    - *install-zig
  script:
    - zig build capture-context-decomp-oracle
    - |
      if ! cmp tests/fuzz/corpus/context_decomp_golden.bin <(git show HEAD:tests/fuzz/corpus/context_decomp_golden.bin); then
        echo "ERROR: context.zig error-trace oracle has diverged from the committed golden file"
        echo "A recent commit changed observable TLS 1.3 handshake behavior"
        echo "Either: (a) the change is intentional — regenerate the golden with 'zig build capture-context-decomp-oracle'"
        echo "Or:     (b) the change is a security regression — revert and investigate"
        exit 1
      fi
  needs:
    - build
