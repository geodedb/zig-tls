name: CI

on:
  push:
    branches: [main, '**']
  pull_request:
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Main build and test job
  test:
    name: Test (${{ matrix.os }}-${{ matrix.arch }}, Zig ${{ matrix.zig }})
    runs-on: runs-on=${{ github.run_id }}/${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu24-full
            arch: x64
            runner: runner=2cpu-linux-x64
          - os: ubuntu24-full
            arch: arm64
            runner: runner=2cpu-linux-arm64
        zig: ['0.15.1']

    steps:
      - uses: spyderorg/workflows/.github/actions/nix-setup@main
        with:
          git-credentials: ${{ secrets.GIT_CREDENTIALS }}
          gh-access-token: ${{ secrets.GH_ACCESS_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Setup Zig 0.15.1
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.1

      - name: Zig version
        run: zig version

      - name: Install OpenSSL dev libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Build library
        run: zig build

      - name: Run unit tests
        run: zig build test --summary all

      - name: Run RFC test vectors
        run: zig build test-vectors --summary all

      - name: Run conformance tests
        run: zig build test-conformance --summary all

      - name: Full CI pipeline
        run: make ci

  # Windows test job
  test-windows:
    name: Test (Windows-latest, Zig ${{ matrix.zig }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        zig: ['0.15.1']

    steps:
      - uses: spyderorg/workflows/.github/actions/nix-setup@main
        with:
          git-credentials: ${{ secrets.GIT_CREDENTIALS }}
          gh-access-token: ${{ secrets.GH_ACCESS_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Setup Zig 0.15.1
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.1

      - name: Zig version
        run: zig version

      - name: Install OpenSSL (vcpkg)
        run: |
          vcpkg install openssl:x64-windows
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      - name: Build library
        run: zig build

      - name: Run unit tests
        run: zig build test --summary all

      - name: Run RFC test vectors
        run: zig build test-vectors --summary all

      - name: Run conformance tests
        run: zig build test-conformance --summary all
        env:
          PKG_CONFIG_PATH: ${{ env.VCPKG_ROOT }}\installed\x64-windows\lib\pkgconfig

  # macOS test job
  test-macos:
    name: Test (macOS-14, Zig ${{ matrix.zig }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        zig: ['0.15.1']

    steps:
      - uses: spyderorg/workflows/.github/actions/nix-setup@main
        with:
          git-credentials: ${{ secrets.GIT_CREDENTIALS }}
          gh-access-token: ${{ secrets.GH_ACCESS_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Setup Zig 0.15.1
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.1

      - name: Zig version
        run: zig version

      - name: Install OpenSSL dev libraries
        run: brew install openssl pkg-config

      - name: Full CI pipeline
        run: make ci

  # Cross-compilation checks
  cross-compile:
    name: Cross-compile (${{ matrix.archive_os }}-${{ matrix.archive_arch }})
    runs-on: runs-on=${{ github.run_id }}/${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: runner=2cpu-linux-x64
            target: arm-linux-gnueabihf
            archive_os: linux
            archive_arch: arm
          - runner: runner=2cpu-linux-x64
            target: aarch64-linux-gnu
            archive_os: linux
            archive_arch: arm64
          - runner: runner=2cpu-linux-x64
            target: riscv64-linux-gnu
            archive_os: linux
            archive_arch: riscv64
          - runner: image=windows22-full-x64
            target: aarch64-windows-msvc
            archive_os: windows
            archive_arch: arm64
        zig: ['0.15.1']

    steps:
      - uses: spyderorg/workflows/.github/actions/nix-setup@main
        with:
          git-credentials: ${{ secrets.GIT_CREDENTIALS }}
          gh-access-token: ${{ secrets.GH_ACCESS_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Setup Zig 0.15.1
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.1

      - name: Zig version
        run: zig version

      - name: Cross-compile for ${{ matrix.target }}
        run: zig build -Dtarget=${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ztls-${{ matrix.archive_os }}-${{ matrix.archive_arch }}-zig-${{ matrix.zig }}
          path: |
            zig-out/bin/
            zig-out/lib/
          retention-days: 7

  # macOS cross-compilation
  cross-compile-macos:
    name: Cross-compile (macOS-x86_64)
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        zig: ['0.15.1']

    steps:
      - uses: spyderorg/workflows/.github/actions/nix-setup@main
        with:
          git-credentials: ${{ secrets.GIT_CREDENTIALS }}
          gh-access-token: ${{ secrets.GH_ACCESS_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Setup Zig 0.15.1
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.1

      - name: Zig version
        run: zig version

      - name: Cross-compile for x86_64-macos
        run: zig build -Dtarget=x86_64-macos

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ztls-macos-x86_64-zig-${{ matrix.zig }}
          path: |
            zig-out/bin/
            zig-out/lib/
          retention-days: 7

  # Code quality checks
  quality:
    name: Code Quality
    runs-on: runs-on=${{ github.run_id }}/runner=2cpu-linux-x64
    steps:
      - uses: spyderorg/workflows/.github/actions/nix-setup@main
        with:
          git-credentials: ${{ secrets.GIT_CREDENTIALS }}
          gh-access-token: ${{ secrets.GH_ACCESS_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Setup Zig 0.15.1
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: '0.15.1'

      - name: Check formatting
        run: |
          zig fmt --check src/ tests/ build.zig || {
            echo "❌ Code formatting issues found. Run 'zig fmt src/ tests/ build.zig' to fix."
            exit 1
          }

      - name: Syntax check
        run: |
          find src tests -name "*.zig" -exec zig ast-check {} \;

  # Release optimization tests
  optimization-tests:
    name: Test with ${{ matrix.optimize }} optimization
    runs-on: runs-on=${{ github.run_id }}/runner=2cpu-linux-x64
    strategy:
      fail-fast: false
      matrix:
        optimize: [Debug, ReleaseSafe, ReleaseFast, ReleaseSmall]
        zig: ['0.15.1']

    steps:
      - uses: spyderorg/workflows/.github/actions/nix-setup@main
        with:
          git-credentials: ${{ secrets.GIT_CREDENTIALS }}
          gh-access-token: ${{ secrets.GH_ACCESS_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Setup Zig 0.15.1
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ matrix.zig }}

      - name: Install OpenSSL dev libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Run tests with ${{ matrix.optimize }}
        run: zig build test -Doptimize=${{ matrix.optimize }} --summary all

  # Summary job that depends on all others
  ci-success:
    name: CI Success
    needs: [test, test-windows, test-macos, cross-compile, cross-compile-macos, quality, optimization-tests]
    runs-on: runs-on=${{ github.run_id }}/runner=2cpu-linux-x64
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [[ "${{ needs.test.result }}" == "success" ]] && \
             [[ "${{ needs.test-windows.result }}" == "success" ]] && \
             [[ "${{ needs.test-macos.result }}" == "success" ]] && \
             [[ "${{ needs.cross-compile.result }}" == "success" ]] && \
             [[ "${{ needs.cross-compile-macos.result }}" == "success" ]] && \
             [[ "${{ needs.quality.result }}" == "success" ]] && \
             [[ "${{ needs.optimization-tests.result }}" == "success" ]]; then
            echo "✅ All CI checks passed!"
            exit 0
          else
            echo "❌ Some CI checks failed"
            echo "test: ${{ needs.test.result }}"
            echo "test-windows: ${{ needs.test-windows.result }}"
            echo "test-macos: ${{ needs.test-macos.result }}"
            echo "cross-compile: ${{ needs.cross-compile.result }}"
            echo "cross-compile-macos: ${{ needs.cross-compile-macos.result }}"
            echo "quality: ${{ needs.quality.result }}"
            echo "optimization-tests: ${{ needs.optimization-tests.result }}"
            exit 1
          fi
