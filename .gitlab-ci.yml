include:
  # Security scanning (Advanced SAST enabled by default)
  - component: gitlab.com/devnw/ci-catalog/security-sast@v1.7.1
    inputs:
      stage: security
  - component: gitlab.com/devnw/ci-catalog/security-dependency-scanning@v1.7.1
    inputs:
      stage: security
  - component: gitlab.com/devnw/ci-catalog/security-secrets@v1.7.1
    inputs:
      stage: security
  - component: gitlab.com/devnw/ci-catalog/security-gitleaks@v1.7.1

  # SBOM generation and scanning
  - component: gitlab.com/devnw/ci-catalog/sbom-generate@v1.7.1
  - component: gitlab.com/devnw/ci-catalog/sbom-scan@v1.7.1
    inputs:
      allow_failure: true

  # Release creation
  - component: gitlab.com/devnw/ci-catalog/release-semantic@v1.7.1
    inputs:
      stage: release

default:
  tags:
    - company
    - linux

variables:
  # Disable git submodules - dependencies are fetched directly in jobs
  GIT_SUBMODULE_STRATEGY: none
  # Zig version and SHA256 hash for supply chain integrity
  # Hash obtained from https://ziglang.org/download/index.json
  # SECURITY: Always verify downloads against official hashes
  ZIG_VERSION: "0.15.2"
  ZIG_SHA256: "02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239"

stages:
  - build
  - test
  - security
  - sbom
  - release

# Zig installation script (reusable) with integrity verification
.install-zig: &install-zig
  - apt-get update && apt-get install -y curl xz-utils
  - curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -o zig.tar.xz
  - echo "${ZIG_SHA256}  zig.tar.xz" | sha256sum -c -
  - tar -xf zig.tar.xz
  - export PATH="$PWD/zig-x86_64-linux-${ZIG_VERSION}:$PATH"
  - zig version

# Build and unit tests
build:
  stage: build
  image: debian:bookworm-slim
  tags:
    - company
    - linux
  before_script:
    - *install-zig
  script:
    - zig build
  artifacts:
    paths:
      - zig-out/
    expire_in: 1 hour

test:
  stage: test
  image: debian:bookworm-slim
  tags:
    - company
    - linux
  before_script:
    - *install-zig
  script:
    - zig build test
  needs:
    - build

# Interoperability testing with OpenSSL/BoringSSL
test-interop:
  stage: test
  image: debian:bookworm-slim
  tags:
    - company
    - linux
  before_script:
    # Install Zig (with hash verification) and OpenSSL development libraries
    - apt-get update && apt-get install -y curl xz-utils libssl-dev
    - curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -o zig.tar.xz
    - echo "${ZIG_SHA256}  zig.tar.xz" | sha256sum -c -
    - tar -xf zig.tar.xz
    - export PATH="$PWD/zig-x86_64-linux-${ZIG_VERSION}:$PATH"
    - zig version
  script:
    - zig build test-conformance
  needs:
    - build

