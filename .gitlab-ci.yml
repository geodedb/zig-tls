---
# GitLab CI/CD Pipeline for tls
# SPDX-License-Identifier: Apache-2.0

# Require BOTH `company` and `linux` tags to exclude the macOS Lab runner
# (which has `company` but not `linux`, is a shell executor ignoring
# `image:`, and has no apt-get / GNU sha256sum). The Debian-based
# install-zig template + bookworm-slim images require a Linux runner.
default:
  tags:
    - company
    - linux

include:
  # SEC-061: Components pinned to commit SHAs (not tags) so an upstream
  # re-tag cannot silently change our pipeline. Comments note the tag
  # that was resolved and the date of resolution. Bump via a deliberate
  # commit that updates SHA + comment together.
  #
  # Security scanning
  - component: gitlab.com/devnw/ci-catalog/security-sast@3122045afd7832332b342ca72065e4db7dde5ed4  # was v1.55.8 (2026-10-10)
  - component: gitlab.com/devnw/ci-catalog/security-dependency-scanning@3122045afd7832332b342ca72065e4db7dde5ed4  # was v1.55.8 (2026-10-10)
  - component: gitlab.com/devnw/ci-catalog/security-secrets@3122045afd7832332b342ca72065e4db7dde5ed4  # was v1.55.8 (2026-10-10)
  - component: gitlab.com/devnw/ci-catalog/security-gitleaks@3122045afd7832332b342ca72065e4db7dde5ed4  # was v1.55.8 (2026-10-10)

  # Code quality
  - component: gitlab.com/devnw/ci-catalog/zig-format@3122045afd7832332b342ca72065e4db7dde5ed4  # was v1.55.8 (2026-10-10)

  # SBOM
  - component: gitlab.com/devnw/ci-catalog/sbom-generate@3122045afd7832332b342ca72065e4db7dde5ed4  # was v1.55.8 (2026-10-10)
  - component: gitlab.com/devnw/ci-catalog/sbom-scan@3122045afd7832332b342ca72065e4db7dde5ed4  # was v1.55.8 (2026-10-10)

  # Release
  - component: gitlab.com/devnw/ci-catalog/release-semantic@3122045afd7832332b342ca72065e4db7dde5ed4  # was v1.55.8 (2026-10-10)
  - component: gitlab.com/devnw/ci-catalog/zig-version-tag-check@v1.55.8

variables:
  ZIG_VERSION: "0.16.0"

stages:
  - lint
  - build
  - test
  - fuzz
  - security
  - sbom
  - release

# Zig installation template (SEC-R6-02: SHA-256 verified via ziglang.org index)
.install-zig: &install-zig
  - apt-get update && apt-get install -y curl xz-utils python3
  - |
    if [ ! -f "zig-${ZIG_VERSION}/zig" ]; then
      ARCH=$(uname -m)
      case "$ARCH" in
        x86_64)  ZIG_ARCH="x86_64" ;;
        aarch64) ZIG_ARCH="aarch64" ;;
        arm64)   ZIG_ARCH="aarch64" ;;
        *)       echo "Unsupported architecture: $ARCH"; exit 1 ;;
      esac
      MAJOR=$(echo "$ZIG_VERSION" | cut -d. -f1)
      MINOR=$(echo "$ZIG_VERSION" | cut -d. -f2)
      if [ "$MAJOR" -eq 0 ] && [ "$MINOR" -lt 15 ]; then
        ARCHIVE_NAME="zig-linux-${ZIG_ARCH}-${ZIG_VERSION}"
      else
        ARCHIVE_NAME="zig-${ZIG_ARCH}-linux-${ZIG_VERSION}"
      fi
      TARBALL="${ARCHIVE_NAME}.tar.xz"
      INDEX_FILE=$(mktemp)
      curl -fsSL "https://ziglang.org/download/index.json" -o "${INDEX_FILE}"
      EXPECTED_HASH=$(ZIG_VER="${ZIG_VERSION}" ZIG_ARCH_KEY="${ZIG_ARCH}-linux" ZIG_IDX="${INDEX_FILE}" \
        python3 -c "
    import json, os, sys
    idx = json.load(open(os.environ['ZIG_IDX']))
    pkg = idx.get(os.environ['ZIG_VER'], {}).get(os.environ['ZIG_ARCH_KEY'], {})
    h = pkg.get('shasum', '')
    if not h: sys.exit('SHA-256 not found for ' + os.environ['ZIG_VER'] + '/' + os.environ['ZIG_ARCH_KEY'])
    print(h)
    ")
      rm -f "${INDEX_FILE}"
      curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/${TARBALL}" -o "${TARBALL}"
      echo "${EXPECTED_HASH}  ${TARBALL}" | sha256sum --check --strict
      tar -xJf "${TARBALL}"
      mv "${ARCHIVE_NAME}" "zig-${ZIG_VERSION}"
      rm -f "${TARBALL}"
    fi
  - export PATH="$PWD/zig-${ZIG_VERSION}:$PATH"
  - zig version

# Hidden template: cache the extracted Zig toolchain directory + the
# build's .zig-cache between jobs. Keyed on ZIG_VERSION so toolchain
# bumps invalidate cleanly; .zig-cache keyed on branch so unrelated
# branches do not poison each other.
.cache-zig: &cache-zig
  cache:
    - key: "zig-toolchain-${ZIG_VERSION}"
      paths:
        - "zig-${ZIG_VERSION}/"
      policy: pull-push
    - key: "zig-cache-${CI_COMMIT_REF_SLUG}"
      paths:
        - ".zig-cache/"
      policy: pull-push

# Override zig-format component to use the project's ZIG_VERSION.
# The v1.2.1 component defaults to 0.14.0 and does not accept a version input.
zig-format:
  <<: *cache-zig
  timeout: 15m
  before_script:
    - *install-zig

# Build job
build:
  stage: build
  image: debian:bookworm-slim
  timeout: 30m
  <<: *cache-zig
  before_script:
    - *install-zig
  script:
    - zig build

# Unit tests
test:
  stage: test
  image: debian:bookworm-slim
  timeout: 30m
  <<: *cache-zig
  before_script:
    - *install-zig
  script:
    - zig build test --summary all
  needs:
    - build

# FIPS-140-3 / PQC dual-mode gate. Builds + tests BOTH -Dfips=false (the
# default std_shim backend, no OpenSSL link) AND -Dfips=true (the linked
# OpenSSL FIPS provider) via `make test-dual`. The FIPS provider is built
# by the fips package's `make deps` (latest OpenSSL 3.x + enable-fips),
# wired here through the ci-catalog `zig-fips-build` component whose setup
# runs `make deps` before this job. Linux-required; macOS/Windows gated
# like the existing cross-OS rules.
#
# NOTE: until the ci-catalog `zig-fips-build` / `fips-deps` component is
# published + the fips package has a git remote, this job is allow-failure
# so the pipeline stays green; flip allow_failure to false once the
# component lands.
test-fips:
  stage: test
  image: debian:bookworm-slim
  timeout: 45m
  <<: *cache-zig
  before_script:
    - *install-zig
    # ci-catalog component setup runs `make deps` (latest OpenSSL + FIPS
    # provider) and installs it to OPENSSL_PREFIX (default /usr/local/ssl).
    - export OPENSSL_PREFIX="${OPENSSL_PREFIX:-/usr/local/ssl}"
  script:
    - make test-dual OPENSSL_PREFIX="${OPENSSL_PREFIX}"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  allow_failure: true
  needs:
    - job: build
      optional: true

# Release optimization tests
test-release-safe:
  stage: test
  image: debian:bookworm-slim
  timeout: 45m
  <<: *cache-zig
  before_script:
    - *install-zig
  script:
    - zig build test -Doptimize=ReleaseSafe --summary all
  needs:
    - build

# ReleaseFast tests
test-release-fast:
  stage: test
  image: debian:bookworm-slim
  timeout: 45m
  <<: *cache-zig
  before_script:
    - *install-zig
  script:
    - zig build test -Doptimize=ReleaseFast --summary all
  needs:
    - build

# ReleaseSmall tests
test-release-small:
  stage: test
  image: debian:bookworm-slim
  timeout: 45m
  <<: *cache-zig
  before_script:
    - *install-zig
  script:
    - zig build test -Doptimize=ReleaseSmall --summary all
  needs:
    - build

# SEC-077: Validate the insecure-testing build flag path.
# The default test suite (above) runs with -Dtls-insecure-testing=false, which
# exercises the runtime-gate code path but skips tests that actually use
# InsecureValidation.testing_only_i_know_what_i_am_doing. This job runs the
# complementary flag (=true) so the insecure-gated tests actually execute and
# the sentinel enum paths get non-zero coverage on every MR.
test-insecure-flag:
  stage: test
  image: debian:bookworm-slim
  timeout: 30m
  <<: *cache-zig
  before_script:
    - *install-zig
  script:
    - zig build test -Dtls-insecure-testing=true --summary all
  needs:
    - build
  allow_failure: false

# Interoperability / conformance tests.
# Exercises the full `zig build test-conformance` target, which includes the
# BoringSSL/OpenSSL conformance suite and the mTLS OpenSSL interop tests
# (tests/conformance/openssl/mtls_interop.zig). Requires libssl-dev and
# pkg-config; install lives in before_script so a missing dev package fails
# the job loudly rather than silently skipping.
test-conformance:
  stage: test
  image: debian:bookworm-slim
  timeout: 45m
  <<: *cache-zig
  before_script:
    - apt-get update && apt-get install -y libssl-dev pkg-config
    - *install-zig
    - pkg-config --exists openssl && pkg-config --modversion openssl
  script:
    - zig build test-conformance --summary all
  needs:
    - build

# Coverage-guided fuzz testing.
# Runs with a 60-second timeout so the job always terminates.
#
# Exit-code semantics:
#   rc=0   : fuzzer stopped cleanly before timeout (no crash)
#   rc=124 : timeout reached (expected in CI) - pass
#   other  : fuzzer found a crash - FAIL THE JOB
#
# Seed corpus under tests/fuzz/corpus/ is copied into zig-out/fuzz/ before
# the run so prior-regression inputs are exercised first. The evolved
# corpus is persisted via GitLab cache so every run continues coverage
# from the previous one.
fuzz:
  stage: fuzz
  image: debian:bookworm-slim
  timeout: 20m
  before_script:
    - *install-zig
    - mkdir -p zig-out/fuzz
    - if [ -d tests/fuzz/corpus ]; then cp -R tests/fuzz/corpus/. zig-out/fuzz/; fi
  # GAP-0109: RSA-PSS differential regression gate runs the committed seed
  # corpus against both sig.rsa_pss_verify_sha256 and
  # parallel.verifyRsaPssWithHash, and fails the job if they diverge.
  # Coverage-guided mutation (`zig build test --fuzz`) cannot run on Zig
  # 0.16: the stdlib test runner hits a writeStackTrace signature mismatch
  # in lib/compiler/test_runner.zig:566 AND emits "error: no fuzz tests
  # found" (exit 1) because no tests use std.testing.fuzz yet. Restore
  # that invocation once the stdlib is fixed upstream.
  script:
    - timeout 60 zig build fuzz-rsa-pss; rc=$?; if [ $rc -ne 0 ] && [ $rc -ne 124 ]; then exit $rc; fi
  artifacts:
    when: always
    paths:
      - zig-out/fuzz/
    expire_in: 30 days
  cache:
    - key: "fuzz-corpus-${CI_COMMIT_REF_SLUG}"
      paths:
        - zig-out/fuzz/
      policy: pull-push
    - key: "zig-toolchain-${ZIG_VERSION}"
      paths:
        - "zig-${ZIG_VERSION}/"
      policy: pull-push
    - key: "zig-cache-${CI_COMMIT_REF_SLUG}"
      paths:
        - ".zig-cache/"
      policy: pull-push
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
  needs:
    - job: build
      optional: true

# SEC-074 regression guard: block re-introduction of raw
# `std.os.linux.getrandom` in src/. The cross-platform, fail-closed wrapper
# lives at src/entropy.zig (`fillRandom` -> `io().randomSecure` with a
# TLS-specific panic on `error.EntropyUnavailable`). Any future call site
# that reaches for the Linux syscall directly bypasses the SEC-074 fix and
# the SEC-081 portability fix simultaneously — fail the pipeline.
no-raw-getrandom:
  stage: test
  image: debian:bookworm-slim
  timeout: 5m
  script:
    - |
      if grep -R 'std\.os\.linux\.getrandom' src/ | grep -v '^\s*//' | grep -v '^\s*!'; then
        echo "SEC-074 regression: raw std.os.linux.getrandom in src/. Use src/entropy.zig fillRandom instead."
        exit 1
      fi
      echo "SEC-074 guard OK — no raw getrandom in src/"
  allow_failure: false

# QUAL-339: ClientHello error-trace oracle regression gate.
# Re-runs the capture harness against HEAD and fails if the regenerated
# golden file diverges from the committed one. Byte-identical output is
# the empirical proof that SEC-054 errdefer, SEC-057 enum guard, and
# CWE-345 psk_seen ordering invariants all still hold after any future
# ClientHello parser/builder change.
client_hello_oracle:
  stage: test
  image: debian:bookworm-slim
  timeout: 10m
  <<: *cache-zig
  before_script:
    - *install-zig
  script:
    # Snapshot the committed golden before regeneration. debian:bookworm-slim
    # has no `git`, so `git show HEAD:...` is unavailable; the checkout on
    # disk IS HEAD at job start, so plain `cp` captures the same bytes.
    - cp tests/fuzz/corpus/client_hello_golden.bin /tmp/client_hello_golden.committed.bin
    - zig build capture-client-hello-oracle
    - |
      if ! cmp tests/fuzz/corpus/client_hello_golden.bin /tmp/client_hello_golden.committed.bin; then
        echo "ERROR: ClientHello error-trace oracle has diverged from the committed golden file"
        echo "This means a recent commit changed ClientHello parser behavior"
        echo "Either: (a) the change is intentional — regenerate the golden with 'zig build capture-client-hello-oracle'"
        echo "Or:     (b) the change is a security regression — revert and investigate"
        exit 1
      fi
  needs:
    - build

# QUAL-317: context.zig decomposition error-trace oracle regression gate.
# Mirrors the QUAL-339 client_hello_oracle job. Re-runs the capture harness
# against HEAD and fails if the regenerated golden diverges from the
# committed one. Byte-identical output is the empirical proof that the
# 8-module decomposition of Context has preserved every observable TLS 1.3
# handshake behavior (RFC 8446 §4/§7.2, SEC-054 errdefer, CWE-226 KU
# secret zeroization, PSK binder timing_safe, HRR transcript hash).
context_decomp_oracle:
  stage: test
  image: debian:bookworm-slim
  timeout: 15m
  <<: *cache-zig
  before_script:
    - *install-zig
  script:
    # Snapshot the committed golden before regeneration. debian:bookworm-slim
    # has no `git`, so `git show HEAD:...` is unavailable; the checkout on
    # disk IS HEAD at job start, so plain `cp` captures the same bytes.
    - cp tests/fuzz/corpus/context_decomp_golden.bin /tmp/context_decomp_golden.committed.bin
    - zig build capture-context-decomp-oracle
    - |
      if ! cmp tests/fuzz/corpus/context_decomp_golden.bin /tmp/context_decomp_golden.committed.bin; then
        echo "ERROR: context.zig error-trace oracle has diverged from the committed golden file"
        echo "A recent commit changed observable TLS 1.3 handshake behavior"
        echo "Either: (a) the change is intentional — regenerate the golden with 'zig build capture-context-decomp-oracle'"
        echo "Or:     (b) the change is a security regression — revert and investigate"
        exit 1
      fi
  needs:
    - build
