# SPDX-License-Identifier: Apache-2.0
# Copyright (c) 2024-2025 CodePros

include:
  # Security scanning (Advanced SAST enabled by default)
  - component: gitlab.com/devnw/ci-catalog/security-sast@v1.7.1
    inputs:
      stage: security
  - component: gitlab.com/devnw/ci-catalog/security-dependency-scanning@v1.7.1
    inputs:
      stage: security
  - component: gitlab.com/devnw/ci-catalog/security-secrets@v1.7.1
    inputs:
      stage: security
  - component: gitlab.com/devnw/ci-catalog/security-gitleaks@v1.7.1

  # SBOM generation and scanning
  - component: gitlab.com/devnw/ci-catalog/sbom-generate@v1.7.1
  - component: gitlab.com/devnw/ci-catalog/sbom-scan@v1.7.1
    inputs:
      allow_failure: true

  # Release creation
  - component: gitlab.com/devnw/ci-catalog/release-semantic@v1.7.1
    inputs:
      stage: release

default:
  tags:
    - company
    - linux

variables:
  # Disable git submodules - dependencies are fetched directly in jobs
  GIT_SUBMODULE_STRATEGY: none

stages:
  - build
  - test
  - security
  - sbom
  - release

# Zig installation script (reusable)
.install-zig: &install-zig
  - apt-get update && apt-get install -y curl xz-utils
  - curl -fsSL https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz -o zig.tar.xz
  - tar -xf zig.tar.xz
  - export PATH="$PWD/zig-x86_64-linux-0.15.2:$PATH"
  - zig version

# Build and unit tests
build:
  stage: build
  image: debian:bookworm-slim
  tags:
    - company
    - linux
  before_script:
    - *install-zig
  script:
    - zig build
  artifacts:
    paths:
      - zig-out/
    expire_in: 1 hour

test:
  stage: test
  image: debian:bookworm-slim
  tags:
    - company
    - linux
  before_script:
    - *install-zig
  script:
    - zig build test
  needs:
    - build

# Interoperability testing with OpenSSL/BoringSSL
test-interop:
  stage: test
  image: debian:bookworm-slim
  tags:
    - company
    - linux
  before_script:
    # Install Zig and OpenSSL development libraries directly (no submodules)
    - apt-get update && apt-get install -y curl xz-utils libssl-dev
    - curl -fsSL https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz -o zig.tar.xz
    - tar -xf zig.tar.xz
    - export PATH="$PWD/zig-x86_64-linux-0.15.2:$PATH"
    - zig version
  script:
    - zig build test-conformance
  needs:
    - build

