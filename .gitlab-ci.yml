stages:
  - build
  - test
  - cross-compile

variables:
  ZIG_VERSION: "0.15.1"

# =============================================================================
# Linux Jobs (GitLab.com shared runners)
# =============================================================================

build-linux:
  stage: build
  image: ubuntu:24.04
  cache:
    key: "linux-zig-${ZIG_VERSION}"
    paths:
      - zig-${ZIG_VERSION}/
  before_script:
    - apt-get update && apt-get install -y curl xz-utils libssl-dev pkg-config make
    - |
      if [ ! -f "zig-${ZIG_VERSION}/zig" ]; then
        curl -L "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" | tar -xJ
        mv "zig-x86_64-linux-${ZIG_VERSION}" "zig-${ZIG_VERSION}"
      fi
    - export PATH="$PWD/zig-${ZIG_VERSION}:$PATH"
    - zig version
  script:
    - export PATH="$PWD/zig-${ZIG_VERSION}:$PATH"
    - zig build
    - zig build test --summary all
    - zig build test-vectors --summary all
    - zig build test-conformance --summary all
    - make ci
  artifacts:
    paths:
      - zig-out/
    expire_in: 1 day

test-linux-arm64:
  stage: test
  image: ubuntu:24.04
  tags:
    - saas-linux-medium-arm64
  cache:
    key: "linux-arm64-zig-${ZIG_VERSION}"
    paths:
      - zig-${ZIG_VERSION}/
  before_script:
    - apt-get update && apt-get install -y curl xz-utils libssl-dev pkg-config make
    - |
      if [ ! -f "zig-${ZIG_VERSION}/zig" ]; then
        curl -L "https://ziglang.org/download/${ZIG_VERSION}/zig-aarch64-linux-${ZIG_VERSION}.tar.xz" | tar -xJ
        mv "zig-aarch64-linux-${ZIG_VERSION}" "zig-${ZIG_VERSION}"
      fi
    - export PATH="$PWD/zig-${ZIG_VERSION}:$PATH"
    - zig version
  script:
    - export PATH="$PWD/zig-${ZIG_VERSION}:$PATH"
    - zig build
    - zig build test --summary all
    - zig build test-vectors --summary all
    - zig build test-conformance --summary all

# =============================================================================
# macOS Jobs (GitLab.com SaaS runners)
# =============================================================================

build-macos:
  stage: build
  tags:
    - saas-macos-medium-m1
  cache:
    key: "macos-zig-${ZIG_VERSION}"
    paths:
      - zig-${ZIG_VERSION}/
  before_script:
    - brew install openssl pkg-config
    - |
      if [ ! -f "zig-${ZIG_VERSION}/zig" ]; then
        curl -L "https://ziglang.org/download/${ZIG_VERSION}/zig-aarch64-macos-${ZIG_VERSION}.tar.xz" | tar -xJ
        mv "zig-aarch64-macos-${ZIG_VERSION}" "zig-${ZIG_VERSION}"
      fi
    - export PATH="$PWD/zig-${ZIG_VERSION}:$PATH"
    - zig version
  script:
    - export PATH="$PWD/zig-${ZIG_VERSION}:$PATH"
    - zig build
    - zig build test --summary all
    - zig build test-vectors --summary all
    - make ci
  artifacts:
    paths:
      - zig-out/
    expire_in: 1 day

# =============================================================================
# Windows Jobs (GitLab.com SaaS runners)
# Note: Conformance tests are skipped on Windows because Zig cannot easily
# link against vcpkg-installed OpenSSL. Conformance is validated on Linux/macOS.
# =============================================================================

build-windows:
  stage: build
  tags:
    - saas-windows-medium-amd64
  timeout: 30 minutes
  cache:
    key: "windows-zig-${ZIG_VERSION}"
    paths:
      - zig-${ZIG_VERSION}/
  before_script:
    # Install Zig
    - |
      if (!(Test-Path "zig-${env:ZIG_VERSION}\zig.exe")) {
        Invoke-WebRequest -Uri "https://ziglang.org/download/${env:ZIG_VERSION}/zig-x86_64-windows-${env:ZIG_VERSION}.zip" -OutFile "zig.zip"
        Expand-Archive -Path "zig.zip" -DestinationPath "."
        Rename-Item "zig-x86_64-windows-${env:ZIG_VERSION}" "zig-${env:ZIG_VERSION}"
      }
    - $env:PATH = "$PWD\zig-${env:ZIG_VERSION};$env:PATH"
    - zig version
  script:
    - $env:PATH = "$PWD\zig-${env:ZIG_VERSION};$env:PATH"
    - zig build
    - zig build test --summary all
    - zig build test-vectors --summary all
    # Note: Conformance tests skipped - require OpenSSL which is complex to link on Windows
  artifacts:
    paths:
      - zig-out/
    expire_in: 1 day

# =============================================================================
# Code Quality
# =============================================================================

quality:
  stage: test
  image: ubuntu:24.04
  cache:
    key: "linux-zig-${ZIG_VERSION}"
    paths:
      - zig-${ZIG_VERSION}/
  before_script:
    - apt-get update && apt-get install -y curl xz-utils findutils
    - |
      if [ ! -f "zig-${ZIG_VERSION}/zig" ]; then
        curl -L "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" | tar -xJ
        mv "zig-x86_64-linux-${ZIG_VERSION}" "zig-${ZIG_VERSION}"
      fi
    - export PATH="$PWD/zig-${ZIG_VERSION}:$PATH"
    - zig version
  script:
    - export PATH="$PWD/zig-${ZIG_VERSION}:$PATH"
    - |
      zig fmt --check src/ tests/ build.zig || {
        echo "Code formatting issues found. Run 'zig fmt src/ tests/ build.zig' to fix."
        exit 1
      }
    - find src tests -name "*.zig" -exec zig ast-check {} \;

# =============================================================================
# Optimization Tests
# =============================================================================

.optimization-test-template:
  stage: test
  image: ubuntu:24.04
  cache:
    key: "linux-zig-${ZIG_VERSION}"
    paths:
      - zig-${ZIG_VERSION}/
  before_script:
    - apt-get update && apt-get install -y curl xz-utils libssl-dev pkg-config
    - |
      if [ ! -f "zig-${ZIG_VERSION}/zig" ]; then
        curl -L "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" | tar -xJ
        mv "zig-x86_64-linux-${ZIG_VERSION}" "zig-${ZIG_VERSION}"
      fi
    - export PATH="$PWD/zig-${ZIG_VERSION}:$PATH"
    - zig version

test-debug:
  extends: .optimization-test-template
  script:
    - export PATH="$PWD/zig-${ZIG_VERSION}:$PATH"
    - zig build test -Doptimize=Debug --summary all

test-release-safe:
  extends: .optimization-test-template
  script:
    - export PATH="$PWD/zig-${ZIG_VERSION}:$PATH"
    - zig build test -Doptimize=ReleaseSafe --summary all

test-release-fast:
  extends: .optimization-test-template
  script:
    - export PATH="$PWD/zig-${ZIG_VERSION}:$PATH"
    - zig build test -Doptimize=ReleaseFast --summary all

test-release-small:
  extends: .optimization-test-template
  script:
    - export PATH="$PWD/zig-${ZIG_VERSION}:$PATH"
    - zig build test -Doptimize=ReleaseSmall --summary all

# =============================================================================
# Cross-Compilation (Linux targets)
# =============================================================================

.cross-compile-template:
  stage: cross-compile
  image: ubuntu:24.04
  cache:
    key: "linux-zig-${ZIG_VERSION}"
    paths:
      - zig-${ZIG_VERSION}/
  before_script:
    - apt-get update && apt-get install -y curl xz-utils
    - |
      if [ ! -f "zig-${ZIG_VERSION}/zig" ]; then
        curl -L "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" | tar -xJ
        mv "zig-x86_64-linux-${ZIG_VERSION}" "zig-${ZIG_VERSION}"
      fi
    - export PATH="$PWD/zig-${ZIG_VERSION}:$PATH"
    - zig version

cross-compile-linux-arm:
  extends: .cross-compile-template
  script:
    - export PATH="$PWD/zig-${ZIG_VERSION}:$PATH"
    - zig build -Dtarget=arm-linux-gnueabihf
  artifacts:
    paths:
      - zig-out/bin/
      - zig-out/lib/
    expire_in: 7 days

cross-compile-linux-arm64:
  extends: .cross-compile-template
  script:
    - export PATH="$PWD/zig-${ZIG_VERSION}:$PATH"
    - zig build -Dtarget=aarch64-linux-gnu
  artifacts:
    paths:
      - zig-out/bin/
      - zig-out/lib/
    expire_in: 7 days

cross-compile-linux-riscv64:
  extends: .cross-compile-template
  script:
    - export PATH="$PWD/zig-${ZIG_VERSION}:$PATH"
    - zig build -Dtarget=riscv64-linux-gnu
  artifacts:
    paths:
      - zig-out/bin/
      - zig-out/lib/
    expire_in: 7 days

# =============================================================================
# Cross-Compilation (Windows ARM64)
# =============================================================================

cross-compile-windows-arm64:
  extends: .cross-compile-template
  script:
    - export PATH="$PWD/zig-${ZIG_VERSION}:$PATH"
    - zig build -Dtarget=aarch64-windows-msvc
  artifacts:
    paths:
      - zig-out/bin/
      - zig-out/lib/
    expire_in: 7 days

# =============================================================================
# Cross-Compilation (macOS x86_64 from Linux)
# =============================================================================

cross-compile-macos-x86_64:
  extends: .cross-compile-template
  script:
    - export PATH="$PWD/zig-${ZIG_VERSION}:$PATH"
    - zig build -Dtarget=x86_64-macos
  artifacts:
    paths:
      - zig-out/bin/
      - zig-out/lib/
    expire_in: 7 days
